

name: Blender Animation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install Blender and rendering libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install \
            -y --no-install-recommends \
            blender ffmpeg xvfb \
            libegl1 libgl1 libopengl0 libgles2 \
            libgl1-mesa-dri libxrender1 libxext6

          blender --version

      - name: Create 3D scene
        run: |
          cat > scene.py <<'PY'
          import bpy
          import math
          from mathutils import Vector

          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)

          scene = bpy.context.scene

          # CPU rendering
          scene.render.engine = "BLENDER_WORKBENCH"
          scene.display.shading.light = "STUDIO"
          scene.display.shading.color_type = "MATERIAL"
          scene.display.shading.show_shadows = True

          # Portrait video
          scene.render.resolution_x = 360
          scene.render.resolution_y = 640
          scene.render.resolution_percentage = 100
          scene.render.fps = 24
          scene.frame_start = 1
          scene.frame_end = 24

          def material(name, color):
              mat = bpy.data.materials.new(name)
              mat.diffuse_color = (*color, 1.0)
              return mat

          blue = material(
              "Blue",
              (0.08, 0.45, 0.95)
          )

          dark = material(
              "Dark Ground",
              (0.08, 0.12, 0.22)
          )

          # Animated 3D object
          bpy.ops.mesh.primitive_uv_sphere_add(
              segments=32,
              ring_count=16,
              location=(-1, 0, 1)
          )

          ball = bpy.context.object
          ball.name = "Animated Object"
          ball.data.materials.append(blue)
          bpy.ops.object.shade_smooth()

          for frame in range(1, 25):
              t = (frame - 1) / 23

              ball.location.x = -1 + 2 * t
              ball.location.z = (
                  1 + 0.5 * math.sin(math.pi * t)
              )

              ball.rotation_euler.y = (
                  2 * math.pi * t
              )

              ball.keyframe_insert(
                  data_path="location",
                  frame=frame
              )

              ball.keyframe_insert(
                  data_path="rotation_euler",
                  frame=frame
              )

          # Ground
          bpy.ops.mesh.primitive_cube_add(
              location=(0, 0, -0.15)
          )

          ground = bpy.context.object
          ground.name = "Ground"
          ground.scale = (5, 5, 0.15)
          ground.data.materials.append(dark)

          # Camera
          bpy.ops.object.camera_add(
              location=(3, -8, 3)
          )

          camera = bpy.context.object
          target = Vector((0, 0, 1))
          direction = target - camera.location

          camera.rotation_euler = (
              direction.to_track_quat(
                  "-Z", "Y"
              ).to_euler()
          )

          camera.data.type = "ORTHO"
          camera.data.ortho_scale = 5
          scene.camera = camera

          # Background
          scene.world.color = (
              0.04, 0.06, 0.12
          )

          scene.render.image_settings.file_format = "PNG"
          scene.render.filepath = "//frames/frame_"

          bpy.ops.wm.save_as_mainfile(
              filepath="animation.blend"
          )

          bpy.ops.render.render(animation=True)
          PY

          mkdir -p frames

      - name: Render animation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: |
          xvfb-run -a \
            -s "-screen 0 1280x1024x24" \
            blender -b -t 2 --python scene.py

      - name: Export MP4
        run: |
          ffmpeg -y \
            -framerate 24 \
            -i frames/frame_%04d.png \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            animation.mp4

      - name: Verify video
        run: |
          test -s animation.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            animation.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: blender-test-video
          path: |
            animation.mp4
            animation.blend
          retention-days: 3
